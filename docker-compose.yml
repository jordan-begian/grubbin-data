services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
    volumes:
      - ./backend:/app
    networks:
      - grubbin-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=
    depends_on:
      - backend
    networks:
      - grubbin-network

networks:
  grubbin-network:
    driver: bridge
