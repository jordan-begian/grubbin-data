version: "3"

vars:
  DB_USER: '{{.DB_USER | default "postgres"}}'
  DB_PASSWORD: '{{.DB_PASSWORD | default "postgres"}}'
  DB_NAME: '{{.DB_NAME | default "grubbin"}}'
  DB_HOST: '{{.DB_HOST | default "localhost"}}'
  DB_PORT: '{{.DB_PORT | default "5432"}}'
  DB_SSL_MODE: '{{.DB_SSL_MODE | default "disable"}}'
  DATABASE_URL: 'postgres://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode={{.DB_SSL_MODE}}'

includes:
  backend:
    taskfile: tasks/backend.yml
    dir: backend
    vars:
      DATABASE_URL: '{{.DATABASE_URL}}'
  db:
    taskfile: tasks/db.yml
    vars:
      DATABASE_URL: '{{.DATABASE_URL}}'
      DB_USER: '{{.DB_USER}}'
      DB_PASSWORD: '{{.DB_PASSWORD}}'
      DB_NAME: '{{.DB_NAME}}'
      DB_HOST: '{{.DB_HOST}}'
      DB_PORT: '{{.DB_PORT}}'
      DB_SSL_MODE: '{{.DB_SSL_MODE}}'
  docker:
    taskfile: tasks/docker.yml
  frontend:
    taskfile: tasks/frontend.yml
    dir: frontend

tasks:
  default:
    cmds:
      - task --list

  up:db:
    desc: Start only the database container
    cmds:
      - task docker:up:db

  up:
    desc: Full dev setup — all services in Docker (postgres + backend + frontend)
    cmds:
      - docker-compose up -d postgres
      - task db:apply
      - docker-compose up --build -d backend frontend
      - |
        echo "All services running in Docker:"
        echo "  Postgres:  localhost:5432"
        echo "  Backend:   localhost:8080"
        echo "  Frontend:  localhost:5173"
        echo ""
        echo "Run 'task logs' to follow logs, or 'task down' to stop."

  up:local:
    desc: Local dev setup — Docker DB + local backend + local frontend
    deps: [docker:up:db]
    cmds:
      - task db:apply
      - |
        cleanup() {
          echo "Stopping backend..."
          kill $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID 2>/dev/null || true
        }
        trap cleanup EXIT
        echo "Building backend..."
        cd backend && go build -o /tmp/grubbin-api cmd/api/main.go
        echo "Starting backend on :8080..."
        DATABASE_URL="{{.DATABASE_URL}}" PORT="8080" ENV="development" /tmp/grubbin-api &
        BACKEND_PID=$!
        sleep 3
        echo "Starting frontend dev server..."
        task frontend:dev
        wait $BACKEND_PID 2>/dev/null || true

  dev:
    desc: Alias for 'up' — full dev setup in Docker
    cmds:
      - task up

  logs:
    desc: Follow Docker Compose logs
    cmds:
      - docker-compose logs -f

  down:
    desc: Stop all Docker services
    cmds:
      - task docker:down

  reset:
    desc: Reset everything — stop, remove volumes, restart
    cmds:
      - |
        echo "Killing any existing local backend..."
        pkill -f "grubbin-api" 2>/dev/null || true
        pkill -f "go run cmd/api/main.go" 2>/dev/null || true
      - task docker:down:volumes
      - task up
